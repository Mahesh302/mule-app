version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo "Installing dependencies..."
      - apt-get update && apt-get install -y zip git curl
      - npm install -g newman

  pre_build:
    commands:
      - echo "Webhook branch: $CODEBUILD_WEBHOOK_HEAD_REF"
      - git config --global user.name "CI Bot"
      - git config --global user.email "ci@example.com"
      - git fetch origin

  build:
    commands:
      - echo "Detecting branch name and running build logic..."
      - |
        BRANCH_NAME=$(echo "$CODEBUILD_WEBHOOK_HEAD_REF" | sed 's|refs/heads/||')
        echo "Running logic for branch: $BRANCH_NAME"
        if [[ "$BRANCH_NAME" == feature/* ]]; then
          echo "Merging feature branch into develop..."
          git checkout develop
          git merge origin/"$BRANCH_NAME" --no-ff -m "Auto-merge from $BRANCH_NAME"
          git push origin develop
        fi
      - chmod +x build.sh
      - ./build.sh
