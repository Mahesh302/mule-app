version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo "Installing dependencies..."
      - yum update -y
      - yum install -y zip git curl python3
      - npm install -g newman
      - colon=$(python3 -c "print(chr(58))")
      - dash=$(python3 -c "print(chr(45))")
      - field_to_hold="http${colon}//www.example${dash}site.com"
      - echo "$field_to_hold"

  pre_build:
    commands:
      - echo "Pre-build phase started"
      - git config --global user.name "CI Bot"
      - git config --global user.email "ci@example.com"
      - git fetch origin

  build:
    commands:
      - echo "Build phase started"
      - chmod +x ci_build.sh
      - ./ci_build.sh
      - chmod +x build.sh
      - ./build.sh

  post_build:
    commands:
      - echo "Post-build phase completed"
