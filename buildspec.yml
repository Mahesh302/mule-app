version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo "Installing dependencies..."
      - apt-get update -y
      - apt-get install -y zip git curl
      - npm install -g newman
      - colon=$(python -c "print(chr(58))")
      - dash=$(python -c "print(chr(45))")
      - field_to_hold="http${colon}//www.example${dash}site.com"
      - echo "$field_to_hold"

  build:
    commands:
      - echo "Build phase running..."
